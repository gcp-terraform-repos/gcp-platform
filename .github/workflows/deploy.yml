name: Deploy bootstrap

# Applies bootstrap/ (the shared WIF pool + this repo's own state bucket +
# its own CI identity) to the hub project automatically on every push to
# main that touches bootstrap/. Everything else here (modules/, examples/)
# has no environment of its own to apply -- see ci.yml.
#
# This workflow authenticates as the gcp-platform-ci service account,
# created by bootstrap/main.tf itself. First apply is necessarily local
# (see README.md "First-time setup") -- this workflow only takes over
# subsequent changes.

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/deploy.yml"

# Never run two applies against the same state at once. GCS backend locking
# would reject the second anyway; queueing produces a clearer failure.
concurrency:
  group: deploy-bootstrap
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: "1.10.6"

jobs:
  apply:
    name: Apply bootstrap
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: bootstrap
        run: tofu init -input=false

      - name: tofu apply
        working-directory: bootstrap
        run: |
          tofu apply -input=false -auto-approve \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}"
