name: CI/CD

# CI: static analysis only for modules/ and examples/ -- no environment of
# their own to exercise against a real hub project. `examples/` is what
# keeps the modules' wiring proven coherent: every module and example gets
# `init -backend=false` + `validate` on every PR and push, no cloud
# credentials needed.
#
# CD: applies bootstrap/ (the shared WIF pool + this repo's own state
# bucket + its own CI identity) to the hub project, gated on CI's two jobs
# passing first, and only on a push to main -- never on a PR. Authenticates
# as the gcp-platform-ci service account, created by bootstrap/main.tf
# itself. First apply is necessarily local (see README.md "First-time
# setup"); this job only takes over subsequent changes.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  TOFU_VERSION: "1.10.6"

jobs:
  validate:
    name: CI / Format and validate
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu validate
        run: |
          for dir in bootstrap modules/*/ examples/*/; do
            dir="${dir%/}"
            echo "::group::validate $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  terraform-docs:
    name: CI / terraform-docs up to date
    runs-on: ubuntu-latest
    concurrency:
      group: ci-docs-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        env:
          TERRAFORM_DOCS_VERSION: "0.24.0"
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            "https://github.com/terraform-docs/terraform-docs/releases/download/v${TERRAFORM_DOCS_VERSION}/terraform-docs-v${TERRAFORM_DOCS_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo mv /tmp/terraform-docs /usr/local/bin/terraform-docs

      - name: Check generated docs are up to date
        run: |
          for dir in modules/*/ examples/*/; do
            dir="${dir%/}"
            echo "::group::check $dir"
            terraform-docs -c .terraform-docs.yml --output-check "$dir"
            echo "::endgroup::"
          done

  cd:
    name: CD / Apply bootstrap
    runs-on: ubuntu-latest
    needs: [validate, terraform-docs]
    # Only on a push to main that CI has already validated -- never on a PR.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      # Never run two applies against the same state at once. GCS backend
      # locking would reject the second anyway; queueing produces a clearer
      # failure.
      group: cd-bootstrap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SERVICE_ACCOUNT }}

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu init
        working-directory: bootstrap
        run: tofu init -input=false

      - name: tofu apply
        working-directory: bootstrap
        run: |
          tofu apply -input=false -auto-approve \
            -var "project_id=${{ vars.GCP_PROJECT_ID }}"
