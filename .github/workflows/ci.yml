name: CI

# Static analysis only -- no real `plan`/`apply` job is possible here since
# this repo has no environments of its own to exercise against a real hub
# project. `examples/` is what keeps the modules' wiring proven coherent:
# every module and example gets `init -backend=false` + `validate` on every
# PR, which needs no cloud credentials.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TOFU_VERSION: "1.10.6"

jobs:
  validate:
    name: Format and validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: ${{ env.TOFU_VERSION }}

      - name: tofu fmt
        run: tofu fmt -check -recursive -diff

      - name: tofu validate
        run: |
          for dir in bootstrap modules/*/ examples/*/; do
            dir="${dir%/}"
            echo "::group::validate $dir"
            tofu -chdir="$dir" init -backend=false -input=false
            tofu -chdir="$dir" validate
            echo "::endgroup::"
          done

  terraform-docs:
    name: terraform-docs up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install terraform-docs
        run: |
          curl -sSLo /tmp/terraform-docs.tar.gz \
            https://github.com/terraform-docs/terraform-docs/releases/download/v0.19.0/terraform-docs-v0.19.0-linux-amd64.tar.gz
          tar -xzf /tmp/terraform-docs.tar.gz -C /tmp terraform-docs
          sudo mv /tmp/terraform-docs /usr/local/bin/terraform-docs

      - name: Check generated docs are up to date
        run: |
          for dir in modules/*/ examples/*/; do
            dir="${dir%/}"
            echo "::group::check $dir"
            terraform-docs -c .terraform-docs.yml --output-check "$dir"
            echo "::endgroup::"
          done
